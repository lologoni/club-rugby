name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club
          POSTGRES_DB: club_rugby
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U club -d club_rugby"
          --health-interval 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://club:club@localhost:5432/club_rugby
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run migrate
      - run: npm test
