services:
  db:
    image: postgres:16-alpine
    container_name: club-rugby-db
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: club_rugby
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U club -d club_rugby']
      interval: 5s
      retries: 10

volumes:
  pgdata:
